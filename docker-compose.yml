name: personal-site

services:
  web:
    build: .
    restart: unless-stopped
    ports:
      - "8080:8000"
    env_file:
      - path: .env
        required: false
    volumes:
      - ./data:/app/data

  # Narrates uploaded books with Kokoro text-to-speech in the background.
  tts:
    build:
      context: .
      dockerfile: Dockerfile.tts
    restart: unless-stopped
    environment:
      - TTS_VOICE=am_michael
    volumes:
      - ./data:/app/data

  # Exposes the site on your domain via Cloudflare Tunnel (no router port forwarding).
  # Start with: docker compose --profile tunnel up -d
  tunnel:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - web
